<style>
*{margin:0;padding:0;box-sizing:border-box}
html,body{width:720pt;height:405pt;overflow:hidden}

.big{position:absolute;left:36pt;top:68pt}

.leg .sw{width:12pt;height:12pt;flex:none}

.rt{position:absolute;left:356pt;top:70pt;font-size:14pt;font-weight:600;color:#0B2C5C}
.thumbs{position:absolute;left:356pt;top:94pt;display:flex;gap:5pt}
.th{position:relative;width:42pt;height:34pt}

.fix{position:absolute;left:356pt;top:172pt;display:flex;align-items:center;gap:10pt}

.ct{position:absolute;left:356pt;top:262pt;font-size:14pt;font-weight:600;color:#0B2C5C}
.cycle{position:absolute;left:356pt;top:288pt;display:flex;align-items:center;gap:6pt}
.cy{width:88pt;height:38pt;border:1pt solid #C5D2E3;display:flex;align-items:center;justify-content:center;background:#FFFFFF}
.cy.on{background:#1B66C9;border-color:#1B66C9}
.cy.on p{color:#fff}
.cy p{font-size:15pt;font-weight:700;color:#0B2C5C}
