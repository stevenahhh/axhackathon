<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.min.css">

<style>
*{margin:0;padding:0;box-sizing:border-box}
html,body{width:720pt;height:405pt;overflow:hidden}
body{font-family:'Pretendard JP','Pretendard','Apple SD Gothic Neo','Noto Sans KR',sans-serif;background:#FFFFFF;color:#1A1A1A;position:relative;word-break:keep-all;line-height:1.35}
.band{position:absolute;left:0;top:0;width:720pt;height:48.6pt;background:#0B2C5C;display:flex;align-items:center;padding:0 36pt;gap:12pt}
.chip{width:26pt;height:26pt;background:#1B66C9;color:#fff;font-size:15pt;font-weight:700;display:flex;align-items:center;justify-content:center;flex:none;line-height:1}
.band h1{color:#fff;font-size:22pt;font-weight:700;letter-spacing:-0.01em;line-height:1.2}
.cap{font-size:11pt;color:#5C6470;position:absolute;left:36pt;bottom:12pt;line-height:1.3}
.lbl{font-size:14pt;color:#5C6470;font-weight:500}
.navy{color:#0B2C5C}.blue{color:#1B66C9}.red{color:#E03B3B}.green{color:#1F9D57}.muted{color:#5C6470}
.abs{position:absolute}

.hero img{position:absolute;left:0;top:0;width:720pt;height:405pt;object-fit:cover;object-position:center}
.shade{position:absolute;left:0;top:0;width:720pt;height:405pt;background:rgba(11,44,92,0.42)}
.boxes{position:absolute;left:0;top:0;width:720pt;height:405pt}
.title{position:absolute;left:48pt;bottom:46pt}
.title h1{font-size:60pt;font-weight:800;color:#fff;letter-spacing:-0.02em;line-height:1.3}
.rule{width:60pt;height:4pt;background:#1B66C9;margin:14pt 0 12pt}
.meta{font-size:15pt;color:#fff;opacity:.9;font-weight:500}
</style>
</head>
<body>
<div class="hero"><img src="./assets/B_0647_T.jpg" alt="영광 태양광발전소 드론 열화상"></div>
<div class="shade"></div>
<svg class="boxes" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 512" preserveAspectRatio="xMidYMid slice" aria-hidden="true">
  <rect x="307" y="149" width="58" height="89" fill="none" stroke="#FFFFFF" stroke-width="6"/>
  <rect x="307" y="149" width="58" height="89" fill="none" stroke="#E03B3B" stroke-width="3"/>
</svg>
<div class="title">
  <h1>썬텍 점검비서</h1>
  <div class="rule"></div>
  <p class="meta">2팀 썬텍 · 2026 전남광주 기업 AX 혁신 챌린지</p>
</div>
</body></html>
