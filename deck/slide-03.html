<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.min.css">
<script src="https://cdn.jsdelivr.net/npm/chart.js@4"></script>
<style>
*{margin:0;padding:0;box-sizing:border-box}
html,body{width:720pt;height:405pt;overflow:hidden}
body{font-family:'Pretendard JP','Pretendard','Apple SD Gothic Neo','Noto Sans KR',sans-serif;background:#FFFFFF;color:#1A1A1A;position:relative;word-break:keep-all;line-height:1.35}
.band{position:absolute;left:0;top:0;width:720pt;height:48.6pt;background:#0B2C5C;display:flex;align-items:center;padding:0 36pt;gap:12pt}
.chip{width:26pt;height:26pt;background:#1B66C9;display:flex;align-items:center;justify-content:center;flex:none}
.chip p{color:#fff;font-size:15pt;font-weight:700;line-height:1.3}
.band h1{color:#fff;font-size:22pt;font-weight:700;letter-spacing:-0.01em;line-height:1.2}
.cap{font-size:12pt;color:#5C6470;position:absolute;left:36pt;bottom:40pt;line-height:1.3}
.lbl{font-size:14pt;color:#5C6470;font-weight:500}
.navy{color:#0B2C5C}.blue{color:#1B66C9}.red{color:#E03B3B}.green{color:#1F9D57}.muted{color:#5C6470}
.row{display:flex;align-items:center}

.steps{position:absolute;left:36pt;top:66pt;width:648pt;display:flex;align-items:center;justify-content:space-between}
.step{display:flex;align-items:center;gap:8pt;height:36pt;padding:0 12pt 0 6pt;border:1pt solid #C5D2E3;background:#FFFFFF}
.step.ai{background:#1B66C9;border-color:#1B66C9}
.step.ai p{color:#fff}
.step p{font-size:14pt;font-weight:600;white-space:nowrap;color:#0B2C5C}
.sq{width:24pt;height:24pt;display:flex;align-items:center;justify-content:center}
.legend{position:absolute;left:36pt;top:110pt;display:flex;gap:14pt}
.legend .item{display:flex;align-items:center;gap:5pt}
.legend p{font-size:14pt;color:#1A1A1A}
.k{width:11pt;height:11pt}
.img{position:absolute;width:110pt;height:88pt}
.img img{width:110pt;height:88pt;display:block}
.pill{position:absolute;left:0;top:0;background:#0B2C5C;padding:2pt 7pt}
.pill p{font-size:14pt;color:#fff;font-weight:600}
.badge{position:absolute;left:318pt;top:196pt;width:86pt;height:36pt;background:#E03B3B;display:flex;align-items:center;justify-content:center}
.badge p{color:#fff;font-size:17pt;font-weight:700}
.alabel{position:absolute;font-size:14pt;font-weight:600;color:#1B66C9}
.wires{position:absolute;left:0;top:0;width:720pt;height:405pt;pointer-events:none}
.chartbox{position:absolute;left:470pt;top:178pt;width:214pt;height:168pt}
.ctitle{position:absolute;left:470pt;top:150pt;font-size:14pt;font-weight:600;color:#0B2C5C;width:214pt}
.ftitle{position:absolute;left:36pt;top:150pt;font-size:14pt;font-weight:600;color:#0B2C5C}
</style>
</head>
<body>

<script>
Chart.defaults.font.family="'Pretendard JP','Pretendard','Apple SD Gothic Neo','Noto Sans KR',sans-serif";Chart.defaults.font.size=18;Chart.defaults.color='#1A1A1A';
const topLabels={id:'tl',afterDatasetsDraw(c){const ctx=c.ctx;c.data.datasets.forEach((ds,i)=>c.getDatasetMeta(i).data.forEach((el,j)=>{ctx.save();ctx.font="800 26px 'Pretendard JP','Pretendard',sans-serif";ctx.fillStyle=ds.backgroundColor[j];ctx.textBaseline='bottom';ctx.textAlign='center';ctx.fillText(ds.data[j]+'장',el.x,el.y-6);ctx.restore();}));}};
new Chart(document.getElementById('fp'),{type:'bar',data:{labels:['열화상만','열화상+실화상'],datasets:[{data:[8,2],backgroundColor:['#5C6470','#1B66C9'],borderWidth:0,barThickness:54}]},options:{animation:false,responsive:true,maintainAspectRatio:false,layout:{padding:{top:36}},plugins:{legend:{display:false},tooltip:{enabled:false}},scales:{y:{display:false,beginAtZero:true,max:9},x:{grid:{display:false},border:{display:false},ticks:{font:{size:19,weight:'600'}}}}},plugins:[topLabels]});
