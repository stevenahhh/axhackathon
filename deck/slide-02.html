<!DOCTYPE html>

<style>
*{margin:0;padding:0;box-sizing:border-box}
html,body{width:720pt;height:405pt;overflow:hidden}
body{font-family:'Pretendard JP','Pretendard','Apple SD Gothic Neo','Noto Sans KR',sans-serif;background:#FFFFFF;color:#1A1A1A;position:relative;word-break:keep-all;line-height:1.35}
.band{position:absolute;left:0;top:0;width:720pt;height:48.6pt;background:#0B2C5C;display:flex;align-items:center;padding:0 36pt;gap:12pt}
.chip{width:26pt;height:26pt;background:#1B66C9;color:#fff;font-size:15pt;font-weight:700;display:flex;align-items:center;justify-content:center;flex:none;line-height:1}
.band h1{color:#fff;font-size:22pt;font-weight:700;letter-spacing:-0.01em;line-height:1.2}
.cap{font-size:12pt;color:#5C6470;position:absolute;left:36pt;bottom:12pt;line-height:1.3}
.lbl{font-size:14pt;color:#5C6470;font-weight:500}
.navy{color:#0B2C5C}.blue{color:#1B66C9}.red{color:#E03B3B}.green{color:#1F9D57}.muted{color:#5C6470}
.abs{position:absolute}

.flow{position:absolute;left:36pt;top:68pt;width:648pt;display:flex;align-items:flex-start;justify-content:space-between;list-style:none}
.flow li{display:flex;flex-direction:column;align-items:center;gap:6pt;width:120pt}
.flow li.arr{width:auto;margin-top:11pt}
.flow p{font-size:14pt;font-weight:600;color:#1A1A1A;white-space:nowrap}
.ring{width:40pt;height:40pt;background:#E8F1FB;border:1.5pt solid #1B66C9;display:flex;align-items:center;justify-content:center}
.big{position:absolute;left:36pt;top:216pt;width:260pt}
.big .num{font-size:52pt;font-weight:800;color:#0B2C5C;letter-spacing:-0.02em;line-height:1.3}
.big .lbl{margin-top:8pt;font-size:15pt}
.chartbox{position:absolute;left:330pt;top:170pt;width:354pt;height:190pt}
.ctitle{position:absolute;left:330pt;top:150pt;font-size:14pt;font-weight:600;color:#0B2C5C}
</style>
</head>
<body>

<script>
